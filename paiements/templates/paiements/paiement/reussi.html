<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Paiement réussi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: radial-gradient(circle at top, #1a1f36, #0b0f1a);
            color: #fff;
        }

        .payment-card {
            background: #111827;
            border-radius: 16px;
            animation: fadeInUp 0.8s ease-out;
        }

        .icon-success {
            color: #22c55e;
            animation: pop 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pop {
            0% { transform: scale(0.5); }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .btn-stripe {
            background: #635bff;
            border: none;
        }

        .btn-stripe:hover {
            background: #524bdb;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

<div class="payment-card shadow-lg p-5 text-center" style="max-width: 460px;">
    <i class="bi bi-check-circle-fill icon-success mb-4" style="font-size: 5rem;"></i>

    <h2 class="fw-bold">Paiement confirmé</h2>
    <p class="text-secondary mt-3">
        Votre paiement a été traité avec succès.  
        Merci pour votre confiance.
    </p>

    <hr class="border-secondary">

    <div class="d-grid gap-3 mt-4">
        <a href="/" class="btn btn-stripe btn-lg text-white">
            Retour à l’accueil
        </a>
        <a href="/commandes/" class="btn btn-outline-light">
            Voir la transaction
        </a>
    </div>
</div>

</body>
</html>
