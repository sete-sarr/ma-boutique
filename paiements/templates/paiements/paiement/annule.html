<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Paiement annulé</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: radial-gradient(circle at top, #1a1f36, #0b0f1a);
            color: #fff;
        }

        .payment-card {
            background: #111827;
            border-radius: 16px;
            animation: shakeFade 0.8s ease-out;
        }

        .icon-error {
            color: #ef4444;
        }

        @keyframes shakeFade {
            0% { opacity: 0; transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            70% { transform: translateX(-5px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .btn-stripe {
            background: #635bff;
            border: none;
        }

        .btn-stripe:hover {
            background: #524bdb;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

<div class="payment-card shadow-lg p-5 text-center" style="max-width: 460px;">
    <i class="bi bi-x-circle-fill icon-error mb-4" style="font-size: 5rem;"></i>

    <h2 class="fw-bold">Paiement annulé</h2>
    <p class="text-secondary mt-3">
        La transaction a été interrompue ou annulée.  
        Aucun débit n’a été effectué.
    </p>

    <hr class="border-secondary">

    <div class="d-grid gap-3 mt-4">
        <a href="/paiement/" class="btn btn-stripe btn-lg text-white">
            Réessayer le paiement
        </a>
        <a href="/" class="btn btn-outline-light">
            Retour à l’accueil
        </a>
    </div>
</div>

</body>
</html>
